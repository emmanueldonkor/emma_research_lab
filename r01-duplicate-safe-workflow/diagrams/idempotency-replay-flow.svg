<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Workflow replay and idempotency decision flow</title>
  <desc id="desc">Unkeyed requests follow the E01 baseline and create a new workflow. Keyed requests inspect idempotency storage, create once if absent, return the existing workflow if matching, or return conflict if the body differs.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526078"/></marker></defs>
  <rect width="960" height="540" fill="#fbfcfe"/>
  <text x="48" y="45" fill="#172033" font-family="Arial, sans-serif" font-size="23" font-weight="700">Request replay decisions — E01, E02, E04</text>
  <text x="48" y="69" fill="#526078" font-family="Arial, sans-serif" font-size="13">The idempotency key is a client-supplied logical-request identifier.</text>
  <g font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="365" y="98" width="230" height="55" rx="8" fill="#eef3fb" stroke="#6681a8"/><text x="480" y="132" fill="#172033" font-weight="700">POST /workflows</text>
    <polygon points="420,197 540,197 580,237 540,277 420,277 380,237" fill="#ffffff" stroke="#6681a8"/><text x="480" y="234" fill="#172033" font-weight="700">Idempotency-Key supplied?</text><text x="480" y="253" fill="#526078" font-size="11">header is optional</text>
    <rect x="72" y="334" width="230" height="65" rx="8" fill="#fff0f0" stroke="#c76a6a"/><text x="187" y="361" fill="#172033" font-weight="700">E01 baseline</text><text x="187" y="381" fill="#526078" font-size="11">create a fresh workflow record</text>
    <rect x="365" y="334" width="230" height="65" rx="8" fill="#f4f7fb" stroke="#6681a8"/><text x="480" y="361" fill="#172033" font-weight="700">Look up key + fingerprint</text><text x="480" y="381" fill="#526078" font-size="11">unique database key guards creation</text>
    <polygon points="420,432 540,432 580,472 540,512 420,512 380,472" fill="#ffffff" stroke="#6681a8"/><text x="480" y="469" fill="#172033" font-weight="700">Matching record exists?</text><text x="480" y="488" fill="#526078" font-size="11">same request fingerprint</text>
    <rect x="658" y="334" width="230" height="65" rx="8" fill="#ecf7f1" stroke="#5c997c"/><text x="773" y="361" fill="#172033" font-weight="700">Create once</text><text x="773" y="381" fill="#526078" font-size="11">store key + workflow; return 201</text>
    <rect x="658" y="442" width="230" height="65" rx="8" fill="#ecf7f1" stroke="#5c997c"/><text x="773" y="467" fill="#172033" font-weight="700">Replay original</text><text x="773" y="486" fill="#526078" font-size="11">return stored workflow; 200</text>
  </g>
  <g stroke="#526078" stroke-width="1.7" fill="none" marker-end="url(#arrow)"><path d="M480 153 L480 197"/><path d="M380 237 L187 237 L187 334"/><path d="M480 277 L480 334"/><path d="M595 366 L773 366"/><path d="M480 399 L480 432"/><path d="M580 472 L658 472"/></g>
  <g fill="#526078" font-family="Arial, sans-serif" font-size="12"><text x="263" y="226">no key</text><text x="500" y="314">key supplied</text><text x="612" y="354">no</text><text x="602" y="462">yes</text></g>
  <text x="52" y="503" fill="#526078" font-family="Arial, sans-serif" font-size="11">If the same key is reused with a different request fingerprint, the service returns 409 Conflict rather than replaying or creating work.</text>
</svg>
